name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare HTML assets
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf /tmp/html_project
          rm -rf app/src/main/assets

          mkdir -p /tmp/html_project
          mkdir -p app/src/main/assets

          unzip -o "$ZIP_FILE" -d /tmp/html_project

          echo "Searching for index.html..."

          INDEX_FILE=$(find /tmp/html_project -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "Found index.html: $INDEX_FILE"

          HTML_DIR=$(dirname "$INDEX_FILE")

          echo "Copying HTML project from: $HTML_DIR"

          cp -R "$HTML_DIR"/. app/src/main/assets/

          echo "Final assets:"
          find app/src/main/assets -type f

          echo "Checking index.html:"
          ls -lh app/src/main/assets/index.html

      - name: Build APK
        run: gradle assembleDebug

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
